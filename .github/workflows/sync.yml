name: Automatic Schedule Sync

on:
  schedule:
    - cron: '0 6,15,21 * * *'  # Uruchamia się 3 razy dziennie
  workflow_dispatch:           # Pozwala kliknąć "Run" ręcznie w dowolnym momencie

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main script
        run: python main.py

      - name: Commit and push generated .ics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add plan_zajec_IOSI.ics last_update_IOSI.txt pobrany_plan.xlsx || true
          git commit -m "Auto-update schedule .ics [skip ci]" || exit 0
          git push
